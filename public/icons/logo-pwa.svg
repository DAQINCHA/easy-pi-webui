<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 安装图标母图（192 / 512 / maskable-512 / apple-touch-180 四张都由它渲染）：
       画板铺满整张画布，圆角 22%（≈ 系统 squircle），图形占画布 80%。
       为什么满幅：Safari「添加到程序坞」取的是 maskable 这张，而 macOS 会把图稿缩到画布 80%
       再套圆角遮罩；图稿自己留透明边就等于缩两遍，Dock 里会明显比原生应用小。
       为什么图形只到 80%：这张同时当 maskable 用，Android 会按 80% 安全圆裁切，
       紫点最外缘离画布中心 48.6%（<50%），圆形遮罩也不会切到。 -->
  <rect width="64" height="64" rx="14" fill="#111113"/>
  <path d="M9.84 25.84c0-2.14 1.68-3.83 3.82-3.83h31.48c2.15 0 3.83 1.69 3.83 3.83" fill="none" stroke="#f2f2f4" stroke-width="6.89" stroke-linecap="round"/>
  <path d="M23.62 22.01v27.55M41.22 22.01v19.14c0 4.59 2.45 7.65 6.12 7.65" fill="none" stroke="#f2f2f4" stroke-width="6.89" stroke-linecap="round"/>
  <circle cx="52.7" cy="15.9" r="4.9" fill="#8b7dff"/>
</svg>
